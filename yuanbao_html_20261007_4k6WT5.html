<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Haven - Coming Soon</title>
    <style>
        :root {
            --bg-dark: #0a192f;
            --text-light: #e6f1ff;
            --accent-gold: #d4af37;
            --text-gray: #8892b0;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 20px;
            max-width: 800px;
        }
        .logo-text {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .logo-sub {
            font-size: 1.2rem;
            color: var(--accent-gold);
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .launching {
            font-size: 1.5rem;
            margin-bottom: 40px;
            color: var(--accent-gold);
        }
        .desc-en {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .desc-cn {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 40px;
            color: var(--text-gray);
        }
        .contact a {
            color: var(--text-light);
            text-decoration: none;
            border-bottom: 1px solid var(--accent-gold);
        }
        .contact {
            margin-bottom: 40px;
        }
        .footer {
            font-size: 0.85rem;
            color: var(--text-gray);
        }
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .logo-text { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-text">STAR HAVEN</div>
        <div class="logo-sub">星辰海外教育</div>
        <h1>Launching Soon</h1>
        <div class="launching">即将上线</div>
        <p class="desc-en">AI-Powered Study & Immigration Planning<br>for Greater Bay Area Families</p>
        <p class="desc-cn">由大数据与人工智能驱动的一站式<br>智能升学与身份规划平台</p>
        <div class="contact">
            <p>联系我们 / Contact Us:</p>
            <a href="mailto:hello@starhaven.com.hk">hello@starhaven.com.hk</a>
        </div>
        <div class="footer">
            &copy; 2026 Star Haven. All Rights Reserved.
        </div>
    </div>
</body>
</html>
